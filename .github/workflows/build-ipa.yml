name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: List Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project BaiyunKeys.xcodeproj \
            -scheme BaiyunKeys \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BaiyunKeys.app Payload/
          zip -r BaiyunKeys.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BaiyunKeys-ipa
          path: BaiyunKeys.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
