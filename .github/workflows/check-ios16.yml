name: iOS 16 兼容性编译检查

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 编译检查iOS 16 API兼容性
        run: |
          xcodebuild build \
            -project "BaiyunKeys.xcodeproj" \
            -scheme "BaiyunKeys" \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
